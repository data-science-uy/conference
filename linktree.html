<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ConnectIA links">
  <title>ConnectIA | Links</title>
  <link rel="shortcut icon" href="assets/images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #223CCF;
      --bg-secondary: #1B2FA6;
      --surface-strong: rgba(255, 255, 255, 0.92);
      --text: #f5f7ff;
      --muted: rgba(245, 247, 255, 0.76);
      --heading: #FFC008;
      --card-text: #222222;
      --card-muted: #515151;
      --shadow: 0 16px 34px rgba(8, 12, 49, 0.16);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --max-width: 540px;
      --highlight: #FFC008;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--text);
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.06), transparent 22%),
        radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.05), transparent 14%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-secondary) 100%);
    }

    /* Esferas de marca de fondo */
    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: -1;
      background-repeat: no-repeat;
      background-size: contain;
    }

    body::before {
      width: 190px;
      height: 190px;
      top: -52px;
      left: -68px;
      background-image: url("assets/images/brand/sphere-green.png");
      filter: blur(2px);
    }

    body::after {
      width: 150px;
      height: 150px;
      bottom: 8%;
      right: -58px;
      background-image: url("assets/images/brand/sphere-magenta.png");
      filter: blur(3px);
    }

    .page-shell::before {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: -1;
      width: 120px;
      height: 120px;
      top: 42%;
      left: -54px;
      background: url("assets/images/brand/sphere-yellow.png") no-repeat center / contain;
      filter: blur(4px);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page-shell {
      width: min(100%, var(--max-width));
      margin: 0 auto;
      padding: 22px 16px 40px;
      position: relative;
    }

    .hero {
      padding: 46px 18px 18px;
    }

    .hero-main {
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      margin-bottom: 18px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 192, 8, 0.95);
      font-size: 0.71rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    h1 {
      margin: 0;
      font-family: "Poppins", sans-serif;
      font-size: clamp(2.5rem, 7vw, 3.8rem);
      line-height: 0.98;
      color: #ffffff;
      font-weight: 800;
    }

    .brand-ia {
      color: var(--highlight);
    }

    .bio {
      max-width: 32ch;
      margin: 16px auto 0;
      font-size: 0.98rem;
      line-height: 1.68;
      color: var(--muted);
    }

    .links-section {
      margin-top: 22px;
      display: grid;
      gap: 12px;
    }

    .link-card {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 14px;
      padding: 14px 15px;
      border-radius: 18px;
      background: var(--surface-strong);
      color: var(--card-text);
      box-shadow: var(--shadow);
      border: 1px solid rgba(34, 60, 207, 0.12);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(8, 12, 49, 0.2);
    }

    .link-card--static:hover {
      transform: none;
      box-shadow: var(--shadow);
    }

    .link-card--silver {
      background: linear-gradient(135deg, #00AD82 0%, #00926E 100%);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.16);
    }

    .link-card--silver .link-icon {
      background: rgba(0, 0, 0, 0.08);
    }

    .link-card--silver .link-tag {
      background: rgba(0, 0, 0, 0.08);
      color: #ffffff;
    }

    .link-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: var(--highlight);
      background: linear-gradient(135deg, #223CCF 0%, #4A5ECD 100%);
      overflow: hidden;
    }

    .link-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .link-icon img.ort-logo {
      width: 84%;
      height: 84%;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }


    .brand-link-icon {
      width: 96%;
      height: auto;
      object-fit: contain;
    }

    .link-copy {
      min-width: 0;
    }

    .link-tag {
      display: inline-flex;
      margin-bottom: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(23, 54, 209, 0.08);
      color: #2644a3;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .link-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.32;
      font-weight: 700;
    }

    .link-description {
      margin: 6px 0 0;
      color: var(--card-muted);
      font-size: 0.89rem;
      line-height: 1.48;
    }

    .availability-note {
      display: inline-block;
      margin-top: 10px;
      color: var(--bg);
      font-weight: 700;
    }

    .event-detail {
      display: block;
    }

    .event-summary {
      display: block;
      margin-top: 6px;
    }


    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 700px) {
      .page-shell {
        padding: 28px 20px 48px;
      }

      .hero {
        padding: 52px 26px 18px;
      }

      .links-section {
        gap: 14px;
      }

      .link-card {
        padding: 15px 16px;
      }
    }

    @media (max-width: 480px) {
      .page-shell {
        padding-inline: 12px;
      }

      .hero {
        padding: 36px 8px 10px;
      }

      .bio {
        font-size: 0.98rem;
      }

      .link-card {
        grid-template-columns: 72px 1fr;
        gap: 12px;
        padding: 12px;
        border-radius: 16px;
      }

      .link-icon {
        width: 68px;
        height: 68px;
        border-radius: 18px;
      }

      .link-title {
        font-size: 0.99rem;
      }

      .link-description {
        font-size: 0.86rem;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <div class="hero-main">
        <div class="eyebrow" id="eyebrow-text">Comunidad + Eventos + IA</div>
        <h1 id="profile-name" style="white-space: nowrap;">Connect<span class="brand-ia">IA</span></h1>
        <p class="bio" id="profile-bio">Conferencia y comunidad para difundir Inteligencia Artificial, Machine Learning, Data Science y Big Data en Uruguay.</p>
      </div>
    </section>

    <section class="links-section" id="links-list"></section>
  </main>

  <script>
    const LINKTREE_CONFIG = {
      theme: {
        bg: "#223CCF",
        bgSecondary: "#1B2FA6",
        surfaceStrong: "rgba(255, 255, 255, 0.9)",
        heading: "#FFC008"
      },
      profile: {
        name: "ConnectIA",
        eyebrow: "Comunidad + Eventos + IA",
        bio: "ConnectIA Conference es un evento de difusión y educación sobre Inteligencia Artificial, Aprendizaje Automático, Ciencia de Datos y Big Data en Uruguay.",
      },
      links: [
        {
          title: "ConnectIA Conference",
          description: "<span class=\"event-detail\">📅 Sábado 31 de octubre</span><span class=\"event-detail\">📍 Auditorio del LATU</span><span class=\"availability-note\">Inscribite en RedTickets</span><span class=\"event-summary\">Un evento gratuito que reúne a profesionales, académicos y estudiantes.</span>",
          url: "https://redtickets.uy/evento/CONNECTIA-2026/32987",
          tag: "ConnectIA Conference",
          icon: "pin"
        },
        {
          title: "Call for Speakers cerrado",
          description: "Las postulaciones cerraron. Estamos evaluando las propuestas recibidas y pronto anunciamos la grilla de speakers.",
          url: "",
          tag: "ConnectIA Conference",
          icon: "microphone"
        },
        {
          title: "Instagram",
          description: "Anuncios, speakers, behind the scenes y novedades de la comunidad.",
          url: "https://instagram.com/connectiauy",
          tag: "Redes",
          icon: "instagram"
        },
        {
          title: "Repasá las presentaciones anteriores",
          description: "Charlas, entrevistas y contenido grabado para seguir aprendiendo.",
          url: "https://www.youtube.com/@connectiauy",
          tag: "Contenido",
          icon: "youtube"
        },
        {
          title: "Sitio web de la conferencia",
          description: "Información completa sobre agenda, speakers, sponsors y ediciones.",
          url: "https://connectia.uy",
          tag: "Oficial",
          icon: "globe"
        },
        {
          title: "Universidad ORT Uruguay",
          description: "",
          url: "https://www.ort.edu.uy/",
          tag: "Sponsor Silver",
          sponsorTier: "silver",
          icon: "ort"
        },
      ]
    };

    const icons = {
      ort: `<img src="assets/images/final/ort-final.png" alt="Universidad ORT Uruguay" class="ort-logo">`,
      instagram: `
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5" stroke="currentColor" stroke-width="0.75"/>
          <circle cx="12" cy="12" r="4.3" stroke="currentColor" stroke-width="0.75"/>
          <circle cx="17.3" cy="6.7" r="1.1" stroke="currentColor" stroke-width="0.75"/>
        </svg>
      `,
      youtube: `
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2.6" y="5.4" width="18.8" height="13.2" rx="4.2" stroke="currentColor" stroke-width="0.75"/>
          <path d="M10.2 9.1l4.8 2.9-4.8 2.9V9.1z" stroke="currentColor" stroke-width="0.75" stroke-linejoin="round"/>
        </svg>
      `,
      globe: `<img src="assets/images/brand/linktree/icon-globe.png" alt="" class="brand-link-icon">`,
      meetup: `
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="9" cy="9" r="2.25" stroke="currentColor" stroke-width="1.9"/>
          <circle cx="15.5" cy="10.2" r="1.9" stroke="currentColor" stroke-width="1.9"/>
          <path d="M5.2 17.8c.7-2.2 2.5-3.5 4.9-3.5s4.2 1.3 4.9 3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          <path d="M14.4 15c1.5.2 2.7 1.2 3.3 2.8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      `,
      pin: `<img src="assets/images/brand/linktree/icon-flash.png" alt="" class="brand-link-icon">`,
      microphone: `<img src="assets/images/brand/linktree/icon-bubble.png" alt="" class="brand-link-icon">`    };

    const root = document.documentElement;
    const { theme, profile, links } = LINKTREE_CONFIG;

    if (theme) {
      if (theme.bg) root.style.setProperty("--bg", theme.bg);
      if (theme.bgSecondary) root.style.setProperty("--bg-secondary", theme.bgSecondary);
      if (theme.surfaceStrong) root.style.setProperty("--surface-strong", theme.surfaceStrong);
      if (theme.heading) root.style.setProperty("--heading", theme.heading);
    }

    document.getElementById("profile-name").innerHTML = profile.name.replace(/IA/g, '<span class="brand-ia">IA</span>');
    document.getElementById("eyebrow-text").textContent = profile.eyebrow;
    document.getElementById("profile-bio").textContent = profile.bio;

    const linksList = document.getElementById("links-list");
    links.forEach((item) => {
      const card = document.createElement(item.url ? "a" : "div");
      card.className = `link-card${item.url ? "" : " link-card--static"}${item.sponsorTier ? ` link-card--${item.sponsorTier}` : ""}`;
      if (item.url) {
        card.href = item.url;
        card.target = item.url.startsWith("http") ? "_blank" : "_self";
        card.rel = item.url.startsWith("http") ? "noreferrer" : "";
      }

      const icon = document.createElement("div");
      icon.className = "link-icon";
      icon.innerHTML = icons[item.icon] || `<span style="font-weight:700;font-size:1.1rem">${item.iconLabel || ""}</span>`;

      const copy = document.createElement("div");
      copy.className = "link-copy";
      copy.innerHTML = `
        ${item.tag ? `<span class="link-tag">${item.tag}</span>` : ""}
        <h2 class="link-title">${item.title}</h2>
        ${item.description ? `<p class="link-description">${item.description}</p>` : ""}
      `;

      card.append(icon, copy);
      linksList.appendChild(card);
    });

  </script>
</body>
</html>
