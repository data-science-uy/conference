<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ConnectIA links">
  <title>ConnectIA | Links</title>
  <link rel="shortcut icon" href="assets/images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1736d1;
      --bg-secondary: #0b1f8b;
      --surface-strong: rgba(255, 255, 255, 0.9);
      --text: #f5f7ff;
      --muted: rgba(245, 247, 255, 0.76);
      --heading: #fff7cf;
      --card-text: #10214d;
      --card-muted: #4c5f90;
      --shadow: 0 22px 48px rgba(8, 12, 49, 0.22);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --max-width: 540px;
      --highlight: #ffd233;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.08), transparent 24%),
        radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.06), transparent 16%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-secondary) 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page-shell {
      width: min(100%, var(--max-width));
      margin: 0 auto;
      padding: 18px 16px 36px;
      position: relative;
    }

    .hero {
      padding: 40px 16px 16px;
    }

    .hero-main {
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      margin-bottom: 16px;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 247, 207, 0.9);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Inter", sans-serif;
      font-size: clamp(2.5rem, 7vw, 3.8rem);
      line-height: 1;
      color: #ffffff;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .brand-ia {
      color: var(--highlight);
    }

    .bio {
      max-width: 32ch;
      margin: 18px auto 0;
      font-size: 1rem;
      line-height: 1.7;
      color: var(--muted);
    }

    .links-section {
      margin-top: 18px;
      display: grid;
      gap: 14px;
    }

    .link-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 14px;
      border-radius: 24px;
      background: var(--surface-strong);
      color: var(--card-text);
      box-shadow: var(--shadow);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .link-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 28px 64px rgba(8, 12, 49, 0.3);
    }

    .link-icon {
      width: 66px;
      height: 66px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: #fff;
      background: linear-gradient(180deg, #1a4bff, #1234b5);
      overflow: hidden;
    }

    .link-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .link-copy {
      min-width: 0;
    }

    .link-tag {
      display: inline-flex;
      margin-bottom: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(23, 54, 209, 0.08);
      color: #2644a3;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .link-title {
      margin: 0;
      font-size: 1.07rem;
      line-height: 1.35;
      font-weight: 700;
    }

    .link-description {
      margin: 6px 0 0;
      color: var(--card-muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .link-arrow {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #1736d1;
      background: rgba(23, 54, 209, 0.06);
      flex-shrink: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 700px) {
      .page-shell {
        padding: 28px 20px 48px;
      }

      .hero {
        padding: 48px 26px 18px;
      }

      .links-section {
        gap: 16px;
      }

      .link-card {
        padding: 16px;
      }
    }

    @media (max-width: 480px) {
      .page-shell {
        padding-inline: 12px;
      }

      .hero {
        padding: 34px 8px 10px;
      }

      .bio {
        font-size: 0.98rem;
      }

      .link-card {
        grid-template-columns: 58px 1fr 38px;
        gap: 12px;
        padding: 12px;
        border-radius: 22px;
      }

      .link-icon {
        width: 58px;
        height: 58px;
        border-radius: 17px;
      }

      .link-title {
        font-size: 0.99rem;
      }

      .link-description {
        font-size: 0.86rem;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <div class="hero-main">
        <div class="eyebrow" id="eyebrow-text">Comunidad + Eventos + IA</div>
        <h1 id="profile-name">Connect<span class="brand-ia">IA</span></h1>
        <p class="bio" id="profile-bio">Conferencia y comunidad para difundir Inteligencia Artificial, Machine Learning, Data Science y Big Data en Uruguay.</p>
      </div>
    </section>

    <section class="links-section" id="links-list"></section>
  </main>

  <script>
    const LINKTREE_CONFIG = {
      theme: {
        bg: "#1736d1",
        bgSecondary: "#0b1f8b",
        surfaceStrong: "rgba(255, 255, 255, 0.9)",
        heading: "#fff7cf"
      },
      profile: {
        name: "ConnectIA",
        eyebrow: "Comunidad + Eventos + IA",
        bio: "ConnectIA Conference es un evento de difusión y educación sobre Inteligencia Artificial, Aprendizaje Automático, Ciencia de Datos y Big Data en Uruguay.",
      },
      links: [
        {
          title: "Meetup #18 | Tue, Apr 28, 2026, 6:30 PM",
          description: "Reservá tu lugar para el próximo encuentro de la comunidad.",
          url: "https://www.meetup.com/connectia/events/314283693/",
          tag: "Próximo evento",
          icon: "meetup"
        },
        {
          title: "Instagram",
          description: "Anuncios, speakers, behind the scenes y novedades de la comunidad.",
          url: "https://instagram.com/connectiauy",
          tag: "Redes",
          icon: "instagram"
        },
        {
          title: "Repasá las presentaciones anteriores",
          description: "Charlas, entrevistas y contenido grabado para seguir aprendiendo.",
          url: "https://www.youtube.com/@connectiauy",
          tag: "Contenido",
          icon: "youtube"
        },
        {
          title: "Sitio web de la conferencia",
          description: "Información completa sobre agenda, speakers, sponsors y ediciones.",
          url: "https://connectia.uy",
          tag: "Oficial",
          icon: "globe"
        }
      ]
    };

    const icons = {
      instagram: `
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2.1"/>
          <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2.1"/>
          <circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/>
        </svg>
      `,
      youtube: `
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2.5" y="5.5" width="19" height="13" rx="4" stroke="currentColor" stroke-width="2"/>
          <path d="M10 9.2l5 2.8-5 2.8V9.2z" fill="currentColor"/>
        </svg>
      `,
      globe: `
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <path d="M3 12h18M12 3c2.8 3 4.2 6 4.2 9s-1.4 6-4.2 9c-2.8-3-4.2-6-4.2-9S9.2 6 12 3z" stroke="currentColor" stroke-width="2"/>
        </svg>
      `,
      meetup: `
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="9" cy="9" r="2.25" stroke="currentColor" stroke-width="1.9"/>
          <circle cx="15.5" cy="10.2" r="1.9" stroke="currentColor" stroke-width="1.9"/>
          <path d="M5.2 17.8c.7-2.2 2.5-3.5 4.9-3.5s4.2 1.3 4.9 3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          <path d="M14.4 15c1.5.2 2.7 1.2 3.3 2.8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      `,
      arrow: `
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 17L17 7M9 7h8v8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `
    };

    const root = document.documentElement;
    const { theme, profile, links } = LINKTREE_CONFIG;

    if (theme) {
      if (theme.bg) root.style.setProperty("--bg", theme.bg);
      if (theme.bgSecondary) root.style.setProperty("--bg-secondary", theme.bgSecondary);
      if (theme.surfaceStrong) root.style.setProperty("--surface-strong", theme.surfaceStrong);
      if (theme.heading) root.style.setProperty("--heading", theme.heading);
    }

    document.getElementById("profile-name").innerHTML = profile.name.replace(/IA/g, '<span class="brand-ia">IA</span>');
    document.getElementById("eyebrow-text").textContent = profile.eyebrow;
    document.getElementById("profile-bio").textContent = profile.bio;

    const linksList = document.getElementById("links-list");
    links.forEach((item) => {
      const card = document.createElement("a");
      card.className = "link-card";
      card.href = item.url;
      card.target = item.url.startsWith("http") ? "_blank" : "_self";
      card.rel = item.url.startsWith("http") ? "noreferrer" : "";

      const icon = document.createElement("div");
      icon.className = "link-icon";
      icon.innerHTML = icons[item.icon] || `<span style="font-weight:700;font-size:1.1rem">${item.iconLabel || ""}</span>`;

      const copy = document.createElement("div");
      copy.className = "link-copy";
      copy.innerHTML = `
        ${item.tag ? `<span class="link-tag">${item.tag}</span>` : ""}
        <h2 class="link-title">${item.title}</h2>
        ${item.description ? `<p class="link-description">${item.description}</p>` : ""}
      `;

      const arrow = document.createElement("div");
      arrow.className = "link-arrow";
      arrow.innerHTML = icons.arrow;

      card.append(icon, copy, arrow);
      linksList.appendChild(card);
    });

  </script>
</body>
</html>
